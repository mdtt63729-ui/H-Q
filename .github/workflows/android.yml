name: Android Unsigned Release APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build unsigned release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Verify unsigned APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "$(find app/build/outputs/apk/release -maxdepth 1 -type f -name "*arm64-v8a*unsigned.apk" -print -quit)"
          echo "Unsigned arm64 release APK(s) found:"
          find app/build/outputs/apk/release -maxdepth 1 -type f -name "*arm64-v8a*unsigned.apk" -exec ls -lh {} \;

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: HiResStream-release-unsigned-arm64
          path: app/build/outputs/apk/release/*arm64-v8a*unsigned.apk
          if-no-files-found: error
